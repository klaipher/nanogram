# Nanogram's Apple Watch app, as embedded in the iOS app.
#
# `xcodegen generate` writes the committed tgwatch.xcodeproj, which the iOS Bazel build
# (apple_prebuilt_watchos_application, Telegram/prebuilt_watchos.bzl) compiles with
# `xcodebuild -configuration Release` and then signs:
#   - watchOS app target only (no container, test or snapshot targets)
#   - bundle id <host>.watchkitapp: the Bazel rule passes TG_WATCH_BUNDLE_ID (not PRODUCT_BUNDLE_IDENTIFIER, which
#     would also rename the widget) and the Info.plist derives the companion id from it
#     ($(PRODUCT_BUNDLE_IDENTIFIER:base)); the widget is <that id>.widget
#   - signing disabled here; the Bazel rule codesigns the output
#   - the WatchWidgetExtension (unread widget, IOS-WATCH-WIDGET-1) is embedded in the app; both share the App Group
#     group.org.klaipher.Nanogram.watch (entitlements in WatchWidget/)
# project-dev.yml includes this file and adds the unit tests (tgwatch-dev.xcodeproj); project-widget.yml switches both
# targets to Xcode automatic signing for device runs from Xcode.
# After editing either file, regenerate both projects.
name: tgwatch
options:
  bundleIdPrefix: org.klaipher   # org.klaipher.Nanogram.watchkitapp, child of the Nanogram app id
  developmentLanguage: en
  deploymentTarget:
    watchOS: "26.0"
# Both configs are required: xcodegen 2.45.4 crashes generating the scheme when
# only one config exists. The embedded build only ever uses Release.
configs:
  Debug: debug
  Release: release
settings:
  base:
    # Swift 6 language mode (complete concurrency checking), like the iOS app's new modules.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TG_WATCH_BUNDLE_ID: org.klaipher.Nanogram.watchkitapp
packages:
  TDShim:
    path: Packages/TDShim
  QRCodeGenerator:
    url: https://github.com/fwcd/swift-qrcode-generator
    exactVersion: 2.0.2
  TLottieKit:
    path: Packages/TLottieKit
  WebPKit:
    path: Packages/WebPKit
  OpusKit:
    path: Packages/OpusKit
targets:
  tgwatch Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: tgwatch Watch App
      - path: Assets/SampleStickers
        buildPhase: resources
        type: folder
      # Also compiled into the widget extension of the widget variant (project-widget.yml).
      - path: Shared
    info:
      path: tgwatch Watch App/Info.plist
      properties:
        CFBundleDisplayName: Nanogram
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # The host app id: PRODUCT_BUNDLE_IDENTIFIER without its last component
        # (".watchkitapp"). Must not be hardcoded; the Bazel rule sets the bundle id per host.
        WKCompanionAppBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER:base)
        # Intentional: keeps the watch app independently installable on the watch
        # while still shipping inside the Nanogram IPA. Do not change to false.
        WKRunsIndependentlyOfCompanionApp: true
        # Long-form music playback keeps going with the wrist down (WATCH-AUDIO-1). Only a session with the
        # long-form route policy uses it, which stays behind WatchFeature.longFormAudio.
        WKBackgroundModes:
          - audio
        TG_API_ID: $(TG_API_ID)
        TG_API_HASH: $(TG_API_HASH)
        NSMicrophoneUsageDescription: Record voice messages to send in chats.
        NSLocationWhenInUseUsageDescription: Share your current location in chats.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_WATCH_BUNDLE_ID)
        DEVELOPMENT_TEAM: YGTMYL879P
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        SKIP_INSTALL: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
      configs:
        Release:
          # Sample stickers are for SwiftUI previews only (StickerBubbleView); keep them out
          # of the shipped app.
          EXCLUDED_SOURCE_FILE_NAMES: SampleStickers
          # Bazel consumes a plain `xcodebuild build`, so DEPLOYMENT_POSTPROCESSING
          # stays NO and the default strip phase never runs — the executable ships
          # with its full ~1M-symbol table, doubling each thinned slice to ~100MB
          # and tripping App Store's 75MB watchOS limit (error 90389). Force the
          # strip during build. Scoped to this target only: a project-wide setting
          # also tries to strip the SPM static libs, which errors on COgg.o.
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: "all"
          DEAD_CODE_STRIPPING: "YES"
    entitlements:
      path: WatchWidget/WatchApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.klaipher.Nanogram.watch
    dependencies:
      - target: WatchWidgetExtension
        embed: true
      - package: TDShim
        product: TDShim
      - package: QRCodeGenerator
        product: QRCodeGenerator
      - package: TLottieKit
        product: TLottieKit
      - package: WebPKit
        product: WebPKit
      - package: OpusKit
        product: OpusKit
  WatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WatchWidget
        excludes:
          - "*.md"
          - "*.entitlements"
      # The same snapshot model the app writes.
      - path: Shared
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Nanogram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidget/WatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.klaipher.Nanogram.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TG_WATCH_BUNDLE_ID).widget
        DEVELOPMENT_TEAM: YGTMYL879P
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
      configs:
        Release:
          DEAD_CODE_STRIPPING: "YES"
schemes:
  tgwatch Watch App:
    build:
      targets:
        tgwatch Watch App: all
    archive:
      config: Release
    run:
      config: Release
      executable: tgwatch Watch App
