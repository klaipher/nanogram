# Xcode device runs of the watch app with its widget (IOS-WATCH-WIDGET-1). The widget is part of the default build
# (project.yml); this overlay only switches the app and the widget to Xcode automatic signing, so they can be run on a
# watch from Xcode (team YGTMYL879P). NOT part of the Bazel embed build. Generate it on demand:
#
#   cd Telegram/WatchApp && xcodegen generate --spec project-widget.yml   # writes tgwatch-widget.xcodeproj (not committed)
#
# The App IDs and the App Group must exist and have the group (tools/dev/device_signing.py profiles does that).
include:
  - project.yml
name: tgwatch-widget
targets:
  tgwatch Watch App:
    settings:
      base:
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
  WatchWidgetExtension:
    settings:
      base:
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
