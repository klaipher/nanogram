name: Sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Bazel version pins agree
        run: |
          want=$(python3 -c 'import json;print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          have=$(cat .bazelversion)
          echo "versions.json: $want, .bazelversion: $have"
          test "$want" = "$have"

      - name: Make.py unit tests
        run: python3 -m unittest discover -s build-system/Make/tests -v

      - name: shellcheck
        run: shellcheck -S warning tools/dev/tg
